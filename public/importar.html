<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolce · Importar datos</title>
<style>
  body{margin:0; background:#FFF8F0; font-family:system-ui,sans-serif; color:#3A2E2A;}
  .wrap{max-width:560px; margin:0 auto; padding:28px 18px 60px;}
  h1{font-size:22px; margin:0 0 6px;}
  p{font-size:14px; line-height:1.5; color:#8A7A72;}
  .box{background:#fff; border:1px solid #EEE0D2; border-radius:14px; padding:16px; margin-bottom:14px;}
  label{display:block; font-weight:600; font-size:13px; margin-bottom:6px;}
  input[type=file]{width:100%; font-size:13px;}
  button{background:#E8536B; color:#fff; border:none; border-radius:9px; padding:11px 18px; font-weight:600; font-size:14px; cursor:pointer;}
  button:disabled{background:#ccc;}
  pre{background:#fff; border:1px solid #EEE0D2; border-radius:12px; padding:14px; font-size:13px; white-space:pre-wrap;}
  a{color:#C93A50;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Importar desde tu Google Sheet</h1>
  <p>En el Sheet: Archivo → Descargar → CSV (una vez por pestaña). Sube aquí los que tengas. Puedes repetirlo sin duplicar datos.</p>

  <div class="box"><label>Pedidos (.csv)</label><input type="file" id="fPedidos" accept=".csv,text/csv"></div>
  <div class="box"><label>Lugares (.csv)</label><input type="file" id="fLugares" accept=".csv,text/csv"></div>
  <div class="box"><label>Compras (.csv)</label><input type="file" id="fCompras" accept=".csv,text/csv"></div>

  <button id="btn">Importar</button>
  <pre id="out" style="display:none;"></pre>
  <p><a href="/">← Volver a la app</a></p>
</div>
<script>
function leer(id){
  return new Promise(resolve => {
    const f = document.getElementById(id).files[0];
    if(!f) return resolve('');
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.readAsText(f);
  });
}
document.getElementById('btn').addEventListener('click', async () => {
  const btn = document.getElementById('btn');
  const out = document.getElementById('out');
  btn.disabled = true; btn.textContent = 'Importando…';
  out.style.display = 'block'; out.textContent = '';
  try{
    const body = {
      pedidos: await leer('fPedidos'),
      lugares: await leer('fLugares'),
      compras: await leer('fCompras')
    };
    const res = await fetch('/api/import', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('Error ' + res.status);
    const r = await res.json();
    const m = n => '$' + Number(n).toLocaleString('es-CO');
    out.textContent =
      'Pedidos: ' + r.pedidos + '  (suma total ' + m(r.sumaPedidos) + ')\n' +
      'Lugares: ' + r.lugares + '\n' +
      'Compras: ' + r.compras + '  (suma ' + m(r.sumaCompras) + ')\n\n' +
      'Compara estas sumas con tu Sheet para confirmar que quedó todo.';
  }catch(e){
    out.textContent = 'No se pudo importar: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Importar';
});
</script>
</body>
</html>
